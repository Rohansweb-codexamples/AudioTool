<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#09090e"><title>AudioTool Studio</title>
<style>
:root{--pink:#ff4fa3;--yellow:#ffe36a;--bg:#09090e;--panel:#191820;--line:#383541;--text:#f8f4fa;--muted:#aaa4b2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px Inter,system-ui,Arial}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:38px 42px 86px minmax(0,1fr) 82px;min-height:0}
.brandbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:#050508;border-bottom:1px solid #25232d}.brandmark{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--yellow));color:#17121a;font-weight:900}.brandbar b{font-size:13px}.filename{margin-left:auto;color:#aaa;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55vw}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:#17161e;border-bottom:1px solid #302d39;padding:0 8px}.tabs::-webkit-scrollbar{display:none}.tab{border:0;background:transparent;padding:0 19px;white-space:nowrap;color:#d4cfda;border-bottom:3px solid transparent}.tab.active{background:#29232d;border-bottom-color:var(--pink);color:white}.tab:hover{background:#28242e}
.ribbon{display:flex;align-items:stretch;gap:5px;padding:7px 10px;background:#22212a;border-bottom:1px solid #383541;overflow-x:auto;scrollbar-width:thin}.tool{min-width:63px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid transparent;border-radius:10px;background:transparent;color:#e9e4ed;font-size:11px;padding:5px 8px;white-space:nowrap}.tool .ico{font-size:21px;color:#ff9bc9;line-height:1}.tool:hover{background:#342b39;border-color:#5a4056}.tool.primary{background:linear-gradient(120deg,var(--pink),#ff9b9a,var(--yellow));color:#17121a;font-weight:800}.tool.primary .ico{color:#17121a}.sep{width:1px;background:#45414d;margin:4px 5px;flex:none}

.wave-scroll{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.wave-stage{height:100%;min-height:210px;min-width:100%;position:relative;background-color:#0a0910;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:100% 25%,80px 100%}

.empty-state{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;pointer-events:none;text-align:center}.empty-state .big{font-size:34px;color:#ff83bd}.empty-state b{font-size:17px}.empty-state small{color:#918b99}
.selection{position:absolute;top:0;bottom:0;background:#ff70b326;border-left:1px solid var(--pink);border-right:1px solid var(--pink);pointer-events:none;display:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:#ffe36a;box-shadow:0 0 8px #ffe36a88;pointer-events:none;display:none}

.bottom{display:grid;grid-template-columns:auto minmax(150px,1fr) auto;align-items:center;gap:15px;padding:8px 13px;background:#17151d;border-top:1px solid #393541}
.transport{display:flex;align-items:center;gap:6px}.transport button{height:48px;min-width:44px;padding:0 12px;border:1px solid #46414e;border-radius:11px;background:linear-gradient(#35323d,#1d1b24);font-size:17px}.transport .play{min-width:62px;background:linear-gradient(120deg,var(--pink),#ff9b9a,var(--yellow));border:0;color:#17121a;font-size:23px;font-weight:900}.transport button:hover{filter:brightness(1.18)}
.progress{min-width:0}.times{display:flex;justify-content:space-between;color:#d2ccd7;font-size:11px;font-variant-numeric:tabular-nums;margin-bottom:6px}.seek{width:100%;accent-color:var(--pink);margin:0}
.bottom-right{display:flex;align-items:center;gap:9px;color:#aaa;font-size:11px}.bottom-right label{display:flex;align-items:center;gap:6px}.bottom-right input{width:75px;accent-color:var(--yellow)}
input[type=file]{display:none}
@media(max-width:720px){.app{grid-template-rows:36px 40px 76px minmax(0,1fr) 76px}.tab{padding:0 13px;font-size:12px}.tool{min-width:55px;font-size:10px}.bottom{grid-template-columns:1fr;gap:4px;padding:5px 8px}.transport{justify-content:center}.transport button{height:37px;min-width:38px}.transport .play{min-width:52px}.progress{display:none}.bottom-right{display:none}.wave-head{height:28px}}
</style></head>
<body><div class="app">
<header class="brandbar"><span class="brandmark">A</span><b>AudioTool</b><span class="filename" id="filename">No audio loaded — choose Open to begin</span></header>
<nav class="tabs" id="tabs"><button class="tab active" data-tab="Home">Home</button><button class="tab" data-tab="Edit">Edit</button><button class="tab" data-tab="Levels">Levels</button><button class="tab" data-tab="Effects">Effects</button><button class="tab" data-tab="Tools">Tools</button><button class="tab" data-tab="Voice">Voice</button><button class="tab" data-tab="Export">Export</button><button class="tab" data-tab="Help">Help</button><button class="tab" data-tab="Favorites">Favorites</button></nav>
<div class="ribbon" id="ribbon"></div>
<main class="editor">
 <div class="wave-head"><strong id="waveTitle">Waveform editor</strong><span id="selectionInfo">No selection</span><span class="spacer"></span><span id="zoomInfo">100%</span></div>
 <div class="wave-scroll" id="waveScroll"><div class="wave-stage" id="waveStage"><canvas id="wave"></canvas><div class="selection" id="selection"></div><div class="playhead" id="playhead"></div><div class="empty-state" id="empty"><div class="big">〰</div><b>Your audio waveform appears here</b><small>Open an audio file or drop one anywhere in this window</small><button class="tool primary" style="pointer-events:auto;min-width:120px" id="emptyOpen"><span class="ico">＋</span>Open audio</button></div></div></div>
 <div class="ruler"><span id="r0">0:00</span><span id="r1">—</span><span id="r2">—</span><span id="r3">—</span><span id="r4">—</span><span id="r5">—</span></div>
</main>
<footer class="bottom"><div class="transport"><button id="record" title="Record microphone">●</button><button class="play" id="play" title="Play / Pause">▶</button><button id="stop" title="Stop">■</button><button id="start" title="Start">|◀</button><button id="back" title="Back 5 seconds">◀◀</button><button id="forward" title="Forward 5 seconds">▶▶</button><button id="end" title="End">▶|</button></div><div class="progress"><div class="times"><span id="current">0:00.000</span><span id="total">0:00.000</span></div><input class="seek" id="seek" type="range" min="0" max="10000" value="0"></div><div class="bottom-right"><label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value="1"></label><span id="volText">100%</span></div></footer>
<input id="file" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac">
<audio id="audio"></audio>
</div>
<script>
const $=id=>document.getElementById(id),audio=$("audio"),canvas=$("wave"),ctx2=canvas.getContext("2d");
let file=null,buffer=null,selection=null,clipboard=null,zoom=1,offset=0,playing=false,raf=0,recorder=null,recordChunks=[],micStream=null,history=[],historyIndex=-1,loop=false;
const state={tab:"Home"};
const fmt=t=>{t=Math.max(0,t||0);let m=Math.floor(t/60),s=(t%60).toFixed(3).padStart(6,"0");return m+":"+s};
const duration=()=>buffer?buffer.duration:0;
function snapshot(){if(!buffer)return;history=history.slice(0,historyIndex+1);history.push(buffer);if(history.length>12)history.shift();historyIndex=history.length-1}
function setStatus(s){$("waveTitle").textContent=s}
function setFileName(s){$("filename").textContent=s}
function sampleAt(t,ch=0){return buffer?buffer.getChannelData(Math.min(ch,buffer.numberOfChannels-1))[Math.max(0,Math.min(buffer.length-1,Math.floor(t*buffer.sampleRate)))]:0}
function visibleRange(){const d=duration(),span=d/zoom;return [offset,Math.min(d,offset+span)]}
function drawWave(){const rect=$("waveStage").getBoundingClientRect(),dpr=devicePixelRatio||1,w=Math.max(1,rect.width),h=Math.max(1,rect.height);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+"px";canvas.style.height=h+"px";ctx2.setTransform(dpr,0,0,dpr,0,0);ctx2.clearRect(0,0,w,h);if(!buffer){$("empty").style.display="flex";return}$("empty").style.display="none";const [from,to]=visibleRange(),span=Math.max(.001,to-from),mid=h/2,step=Math.max(1,Math.floor(buffer.length/(w*zoom)));for(let ch=0;ch<buffer.numberOfChannels;ch++){const data=buffer.getChannelData(ch),top=ch===0?0:mid,bottom=ch===0?(buffer.numberOfChannels>1?mid:h):h,center=(top+bottom)/2,amp=(bottom-top)*.43;ctx2.beginPath();ctx2.strokeStyle=ch===0?"#ff79b8":"#ffe36a";ctx2.lineWidth=1;for(let x=0;x<w;x++){const t=from+x/w*span,idx=Math.min(data.length-1,Math.floor(t*buffer.sampleRate)),bucket=Math.max(1,Math.floor(span/w*buffer.sampleRate));let peak=0;for(let k=0;k<bucket&&idx+k<data.length;k++)peak=Math.max(peak,Math.abs(data[idx+k]));const y=peak*amp;if(x===0)ctx2.moveTo(x,center-y);else ctx2.lineTo(x,center-y);ctx2.moveTo(x,center+y);ctx2.lineTo(x,center+y)}ctx2.stroke()}if(buffer.numberOfChannels>1){ctx2.strokeStyle="#ffffff22";ctx2.beginPath();ctx2.moveTo(0,mid);ctx2.lineTo(w,mid);ctx2.stroke()}drawOverlays()}
function drawOverlays(){if(!buffer)return;const [from,to]=visibleRange(),span=to-from,w=$("waveStage").clientWidth;const sel=$("selection"),head=$("playhead");if(selection){let x1=(selection.start-from)/span*w,x2=(selection.end-from)/span*w;sel.style.display="block";sel.style.left=Math.max(0,x1)+"px";sel.style.width=Math.max(0,Math.min(w,x2)-Math.max(0,x1))+"px";$("selectionInfo").textContent=fmt(selection.start)+" — "+fmt(selection.end)+" · "+fmt(selection.end-selection.start)}else{sel.style.display="none";$("selectionInfo").textContent="No selection"}let x=(audio.currentTime-from)/span*w;head.style.display="block";head.style.left=Math.max(0,Math.min(w,x))+"px";$("zoomInfo").textContent=Math.round(zoom*100)+"%";for(let i=0;i<=5;i++)$("r"+i).textContent=fmt(from+span*i/5)}
function resize(){drawWave()}window.addEventListener("resize",resize);
function setSelection(a,b){let s=Math.max(0,Math.min(a,b)),e=Math.min(duration(),Math.max(a,b));selection=e-s>.005?{start:s,end:e}:null;drawOverlays()}
async function openFile(f){if(!f)return;try{setStatus("Loading waveform…");file=f;const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();const bytes=await f.arrayBuffer();buffer=await ac.decodeAudioData(bytes.slice(0));await ac.close();audio.src=URL.createObjectURL(f);audio.load();selection=null;zoom=1;offset=0;history=[];historyIndex=-1;snapshot();setFileName(f.name);$("empty").style.display="none";drawWave();setStatus("Ready · "+buffer.numberOfChannels+" channel(s) · "+buffer.sampleRate+" Hz");$("total").textContent=fmt(duration());$("seek").value=0}catch(e){console.error(e);alert("This audio file could not be decoded by your browser. Try MP3 or WAV.");setStatus("Could not open file")}}
function play(){if(!buffer)return $("file").click();if(selection&&audio.currentTime<selection.start||selection&&audio.currentTime>=selection.end)audio.currentTime=selection.start;audio.play().catch(()=>{});$("play").textContent="Ⅱ"}
function pause(){audio.pause();$("play").textContent="▶"}
audio.addEventListener("timeupdate",()=>{const d=duration();$("current").textContent=fmt(audio.currentTime);$("seek").value=d?audio.currentTime/d*10000:0;drawOverlays();if(selection&&audio.currentTime>=selection.end&&audio.currentTime>selection.start){if(loop){audio.currentTime=selection.start;audio.play().catch(()=>{})}else{pause();audio.currentTime=selection.start}}});
audio.addEventListener("ended",()=>{$("play").textContent="▶"});
$("play").onclick=()=>audio.paused?play():pause();$("stop").onclick=()=>{pause();audio.currentTime=0};$("start").onclick=()=>audio.currentTime=0;$("end").onclick=()=>audio.currentTime=duration();$("back").onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-5);$("forward").onclick=()=>audio.currentTime=Math.min(duration(),audio.currentTime+5);$("seek").oninput=e=>{if(duration())audio.currentTime=duration()*e.target.value/10000};$("volume").oninput=e=>{audio.volume=+e.target.value;$("volText").textContent=Math.round(audio.volume*100)+"%"};
$("file").onchange=e=>openFile(e.target.files[0]);$("emptyOpen").onclick=()=>$("file").click();
["dragover","drop"].forEach(type=>document.addEventListener(type,e=>{e.preventDefault();if(type==="drop"&&e.dataTransfer.files.length)openFile(e.dataTransfer.files[0])}));
let dragging=false,dragStart=0;
canvas.addEventListener("pointerdown",e=>{if(!buffer)return;const r=canvas.getBoundingClientRect(),[from,to]=visibleRange(),t=from+(e.clientX-r.left)/r.width*(to-from);dragging=true;dragStart=t;canvas.setPointerCapture(e.pointerId);setSelection(t,t+.006)});
canvas.addEventListener("pointermove",e=>{if(!dragging)return;const r=canvas.getBoundingClientRect(),[from,to]=visibleRange(),t=from+(e.clientX-r.left)/r.width*(to-from);setSelection(dragStart,t)});
canvas.addEventListener("pointerup",e=>{if(!dragging)return;dragging=false;if(selection&&selection.end-selection.start<.04){audio.currentTime=selection.start;selection=null;drawOverlays()}});
function makeBuffer(channels,length,rate){return new AudioBuffer({numberOfChannels:channels,length,sampleRate:rate})}
function applyEdit(fn){if(!buffer)return alert("Open an audio file first.");const next=fn(buffer);buffer=next;snapshot();audio.pause();audio.src=URL.createObjectURL(bufferToWav(buffer));audio.load();selection=null;drawWave();$("total").textContent=fmt(duration());setStatus("Edit applied")}
function cutCopy(cut){if(!buffer||!selection)return alert("Drag across the waveform to select audio first.");const s=Math.floor(selection.start*buffer.sampleRate),e=Math.floor(selection.end*buffer.sampleRate);clipboard=makeBuffer(buffer.numberOfChannels,e-s,buffer.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++)clipboard.copyToChannel(buffer.getChannelData(c).slice(s,e),c);if(cut)applyEdit(b=>spliceBuffer(b,s,e,null));}
function spliceBuffer(b,s,e,insert){const add=insert?insert.length:0,n=b.length-(e-s)+add,out=makeBuffer(b.numberOfChannels,n,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++){const a=b.getChannelData(c),o=out.getChannelData(c);o.set(a.slice(0,s));if(insert)o.set(insert.getChannelData(Math.min(c,insert.numberOfChannels-1)),s);o.set(a.slice(e),s+add)}return out}
function bufferToWav(b){const ch=b.numberOfChannels,n=b.length,bytes=44+n*ch*2,v=new DataView(new ArrayBuffer(bytes));let p=0;const str=s=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))};str("RIFF");v.setUint32(p,bytes-8,true);p+=4;str("WAVEfmt ");v.setUint32(p,16,true);p+=4;v.setUint16(p,1,true);p+=2;v.setUint16(p,ch,true);p+=2;v.setUint32(p,b.sampleRate,true);p+=4;v.setUint32(p,b.sampleRate*ch*2,true);p+=4;v.setUint16(p,ch*2,true);p+=2;v.setUint16(p,16,true);p+=2;str("data");v.setUint32(p,n*ch*2,true);p+=4;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([v],{type:"audio/wav"})}
function download(b,name){const url=URL.createObjectURL(bufferToWav(b)),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function selectedBuffer(){if(!buffer)return null;if(!selection)return buffer;const s=Math.floor(selection.start*buffer.sampleRate),e=Math.floor(selection.end*buffer.sampleRate),out=makeBuffer(buffer.numberOfChannels,e-s,buffer.sampleRate);for(let c=0;c<buffer.numberOfChannels;c++)out.copyToChannel(buffer.getChannelData(c).slice(s,e),c);return out}
function effect(kind){if(!buffer)return alert("Open an audio file first.");applyEdit(b=>{const out=makeBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++){const src=b.getChannelData(c),dst=out.getChannelData(c);let peak=0;for(let i=0;i<src.length;i++)peak=Math.max(peak,Math.abs(src[i]));for(let i=0;i<src.length;i++){let x=src[i];if(kind==="reverse")x=src[src.length-1-i];if(kind==="fadein")x*=i/Math.max(1,src.length-1);if(kind==="fadeout")x*=(src.length-1-i)/Math.max(1,src.length-1);if(kind==="normalize")x*=peak?0.95/peak:1;if(kind==="echo"){const delay=Math.floor(b.sampleRate*.22);x+=i>delay?dst[i-delay]*.38:0}dst[i]=Math.max(-1,Math.min(1,x))}}return out})}
function tool(label,icon,fn,primary=false){const b=document.createElement("button");b.className="tool"+(primary?" primary":"");b.innerHTML='<span class="ico"></span><span></span>';b.children[0].textContent=icon;b.children[1].textContent=label;b.onclick=fn;$("ribbon").append(b)}
function group(){const s=document.createElement("span");s.className="sep";$("ribbon").append(s)}
const tabs={
Home(){tool("New","✚",()=>{if(confirm("Start a new project?")){pause();buffer=null;file=null;audio.removeAttribute("src");selection=null;setFileName("No audio loaded");drawWave();setStatus("New project")}});tool("Open","📂",()=>$("file").click(),true);tool("Save WAV","↓",()=>buffer&&download(buffer,(file?.name||"audio").replace(/.[^.]+$/,"")+".wav"));group();tool("Undo","↶",undo);tool("Redo","↷",redo);group();tool("Play","▶",play,true);tool("Stop","■",()=>$("stop").click());tool("Record","●",record)},
Edit(){tool("Cut","✂",()=>cutCopy(true));tool("Copy","▣",()=>cutCopy(false));tool("Paste","▤",paste);tool("Delete selection","×",()=>{if(!selection)return alert("Select a waveform region first.");cutCopy(true)});tool("Select all","▱",()=>setSelection(0,duration()));tool("Trim to selection","⌗",trimTo);tool("Silence","－",silence);tool("Undo","↶",undo);tool("Redo","↷",redo)},
Levels(){tool("Volume up","＋",()=>audio.volume=Math.min(1,audio.volume+.1));tool("Volume down","－",()=>audio.volume=Math.max(0,audio.volume-.1));tool("Normalize","⌁",()=>effect("normalize"));tool("Fade in","↗",()=>effect("fadein"));tool("Fade out","↘",()=>effect("fadeout"));tool("Mute","◖",()=>audio.muted=!audio.muted);tool("Speed 0.5×","½",()=>audio.playbackRate=.5);tool("Speed 1×","1×",()=>audio.playbackRate=1);tool("Speed 1.5×","↗",()=>audio.playbackRate=1.5)},
Effects(){tool("Fade in","↗",()=>effect("fadein"));tool("Fade out","↘",()=>effect("fadeout"));tool("Normalize","⌁",()=>effect("normalize"));tool("Reverse","⇄",()=>effect("reverse"));tool("Echo","〰",()=>effect("echo"));tool("Remove selection","×",()=>cutCopy(true));tool("Undo","↶",undo)},
Tools(){tool("Zoom in","＋",()=>{zoom=Math.min(32,zoom*2);drawWave()});tool("Zoom out","－",()=>{zoom=Math.max(1,zoom/2);offset=0;drawWave()});tool("Fit audio","□",()=>{zoom=1;offset=0;drawWave()});tool("Loop selection","↻",()=>{if(!selection)return alert("Select a region first.");loop=!loop;setStatus(loop?"Loop selection on":"Loop off")});tool("Move to start","|◀",()=>$("start").click());tool("Move to end","▶|",()=>$("end").click());tool("Clear selection","⌫",()=>{selection=null;drawOverlays()})},
Voice(){tool("Record microphone","●",record,true);tool("Stop recording","■",stopRecord);tool("Import audio","＋",()=>$("file").click());tool("Monitor","◉",()=>alert("Microphone recording is captured when you press Record."))},
Export(){tool("Export full WAV","↓",()=>buffer&&download(buffer,"AudioTool-full.wav"),true);tool("Export selection","⇩",()=>{const b=selectedBuffer();if(b)download(b,"AudioTool-selection.wav")});tool("Export MP3","MP3",()=>alert("MP3 encoding is not built in. Export WAV, then convert it with an audio converter."));tool("Audio information","ⓘ",()=>buffer&&alert("Duration: "+duration().toFixed(2)+"s\nSample rate: "+buffer.sampleRate+" Hz\nChannels: "+buffer.numberOfChannels))},
Help(){tool("Keyboard shortcuts","⌨",()=>alert("Space: Play/Pause\nLeft/Right: seek\nCtrl+O: Open\nCtrl+S: Export WAV\nDrag on waveform: select audio"));tool("Supported formats","♫",()=>alert("Your browser decodes common audio formats including WAV, MP3, OGG, M4A and AAC."));tool("About","A",()=>alert("AudioTool — browser audio editor."))},
Favorites(){tool("Open","📂",()=>$("file").click(),true);tool("Cut","✂",()=>cutCopy(true));tool("Copy","▣",()=>cutCopy(false));tool("Paste","▤",paste);tool("Normalize","⌁",()=>effect("normalize"));tool("Export WAV","↓",()=>buffer&&download(buffer,"AudioTool.wav"))}
};
function showTab(name){state.tab=name;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));$("ribbon").innerHTML="";tabs[name]()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function undo(){if(historyIndex>0){historyIndex--;buffer=history[historyIndex];reloadEdited()}}
function redo(){if(historyIndex<history.length-1){historyIndex++;buffer=history[historyIndex];reloadEdited()}}
function reloadEdited(){audio.src=URL.createObjectURL(bufferToWav(buffer));audio.load();selection=null;drawWave();$("total").textContent=fmt(duration());setStatus("Edit restored")}
function paste(){if(!buffer||!clipboard)return alert("Copy a waveform selection first.");const at=Math.floor(audio.currentTime*buffer.sampleRate);applyEdit(b=>spliceBuffer(b,at,at,clipboard))}
function trimTo(){if(!buffer||!selection)return alert("Select a waveform region first.");const s=Math.floor(selection.start*buffer.sampleRate),e=Math.floor(selection.end*buffer.sampleRate);applyEdit(b=>{const out=makeBuffer(b.numberOfChannels,e-s,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)out.copyToChannel(b.getChannelData(c).slice(s,e),c);return out})}
function silence(){if(!buffer||!selection)return alert("Select a waveform region first.");applyEdit(b=>{const out=makeBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++){out.copyToChannel(b.getChannelData(c),c);out.getChannelData(c).fill(0,Math.floor(selection.start*b.sampleRate),Math.floor(selection.end*b.sampleRate))}return out})}
async function record(){try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(micStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recordChunks,{type:recorder.mimeType||"audio/webm"});const f=new File([blob],"Voice-recording.webm",{type:blob.type});openFile(f);micStream.getTracks().forEach(t=>t.stop());setStatus("Recording imported")};recorder.start();setStatus("Recording microphone…")}catch(e){alert("Microphone access was blocked or is unavailable. Allow microphone permission and try again.")}}
function stopRecord(){if(recorder&&recorder.state!=="inactive")recorder.stop()}
$("record").onclick=record;
$("tabs").addEventListener("wheel",e=>{if(e.deltaY){e.currentTarget.scrollLeft+=e.deltaY}});
document.addEventListener("keydown",e=>{if(e.target.matches("input"))return;if(e.code==="Space"){e.preventDefault();audio.paused?play():pause()}if(e.code==="ArrowLeft"&&buffer)audio.currentTime=Math.max(0,audio.currentTime-5);if(e.code==="ArrowRight"&&buffer)audio.currentTime=Math.min(duration(),audio.currentTime+5);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="o"){$("file").click();e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){if(buffer)download(buffer,"AudioTool.wav");e.preventDefault()}});
showTab("Home");drawWave();$("total").textContent=fmt(0);
</script></body></html>
